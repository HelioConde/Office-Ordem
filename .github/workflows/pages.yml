name: Office Ordem — QA e GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: office-ordem-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Montar publicação segura sem banco
        run: |
          node --check demo.js
          mkdir -p dist preview/Office-Ordem
          cp index.html demo.css demo.js favicon.ico dist/
          cp dist/* preview/Office-Ordem/
          test "$(find dist -type f | wc -l)" -eq 4
          ! find dist -type f | grep -Ei '\.(php|sql|env)$'
      - name: Playwright CLI e navegador
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4174 --bind 127.0.0.1 --directory preview > /tmp/office-preview.log 2>&1 &
          node tests/qa.mjs
          npx playwright screenshot --browser chromium --viewport-size "390,844" --full-page "http://127.0.0.1:4174/Office-Ordem/" screenshots/office-cli-mobile.png
      - name: Capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-ordem-qa-screenshots
          path: screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
