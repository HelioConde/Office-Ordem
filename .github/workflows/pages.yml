name: Office Ordem - Static Pages e QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: office-ordem-pages
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Montar site estatico sem bundles legados
        run: |
          mkdir -p dist-pages
          cp site/index.html site/style.css site/app.js site/favicon.svg dist-pages/
          node --check site/app.js
          node --test tests/smoke.cjs tests/pages-entry.cjs
          test "$(find dist-pages -type f | wc -l)" -eq 4
      - name: Capturas Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/pages.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-ordem-screenshots
          path: screenshots/
          if-no-files-found: ignore
  deploy:
    if: github.event_name != 'pull_request'
    needs: qa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar arquivos publicados
        run: |
          mkdir -p dist-pages
          cp site/index.html site/style.css site/app.js site/favicon.svg dist-pages/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4